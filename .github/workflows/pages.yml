name: Deploy release demo to Pages
run-name: Deploy demo from ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example v0.8.12)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the released demo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v0.8.12." >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" == true ]]; then
            echo "Pages requires a published stable release." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "volvoxgrid-demo-${version}.zip" --dir "$RUNNER_TEMP/release-demo"
          mkdir _site
          unzip -q "$RUNNER_TEMP/release-demo/volvoxgrid-demo-${version}.zip" -d _site
          test "$(cat _site/VERSION)" = "$version"
          test -f _site/index.html
          test -f _site/demos/web/index.html
          test -f _site/demos/web/wasm/volvoxgrid_wasm.js
          test -f _site/demos/web/wasm/volvoxgrid_wasm_bg.wasm

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
