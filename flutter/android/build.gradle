group = "io.github.ivere27.volvoxgrid"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.12.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// ── VolvoxGrid Source Configuration ────────────────────────────────────────
apply from: new File(projectDir, "../native/config.gradle")
def repoRoot = volvoxgridRepositoryRoot ?: new File(projectDir, "../..")
def volvoxgridSource = volvoxgridNativeSource
def volvoxgridVersion = volvoxgridNativeVersion
if (volvoxgridSource == "local" && volvoxgridRepositoryRoot == null) {
    throw new GradleException(
        "VolvoxGrid: Android local mode requires a monorepo checkout with Android helper sources. " +
        "Use VOLVOXGRID_SOURCE=maven for pub packages, or a path dependency on the repository's flutter directory."
    )
}

def volvoxgridVariant = System.getenv("VOLVOXGRID_VARIANT") ?: ""
def artifactName = volvoxgridVariant == "lite" ? "volvoxgrid-android-lite" : "volvoxgrid-android"
def nativeLibraryName = volvoxgridVariant == "lite" ? "libvolvoxgrid_lite.so" : "libvolvoxgrid.so"
def isSnapshot = volvoxgridVersion.endsWith("-SNAPSHOT")
def generatedJniLibsDir = new File(buildDir, "generated/jniLibs")
def generatedLocalSourcesDir = new File(buildDir, "generated/source/volvoxgridLocal/main/kotlin")
def androidNativeWindowHelperSource = new File(
    repoRoot,
    "android/volvoxgrid-android/src/main/java/io/github/ivere27/volvoxgrid/NativeWindowHelper.kt"
)
def localNativeHelperCmakePath = new File(repoRoot, "android/volvoxgrid-android/src/main/jni/CMakeLists.txt")
def supportedAndroidAbis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
def flutterTargetAbis = [
    "android-arm": "armeabi-v7a",
    "android-arm64": "arm64-v8a",
    "android-x64": "x86_64",
    "android-x86": "x86",
]
def requestedAndroidAbis = (project.findProperty("target-platform") ?:
    "android-arm,android-arm64,android-x64").toString().split(",").collect { target ->
    def abi = flutterTargetAbis[target.trim()]
    if (abi == null) throw new GradleException("VolvoxGrid: Unsupported Android target-platform '${target}'.")
    abi
}
def checkRequestedAbis = { Collection<String> available ->
    def missing = requestedAndroidAbis.findAll { !available.contains(it) }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "VolvoxGrid: Native library is missing requested Android ABI(s): ${missing.join(', ')}. " +
            "Available ABI(s): ${available.join(', ')}. For ARM phones build with " +
            "`flutter build apk --target-platform android-arm,android-arm64` " +
            "(or android-arm64 only), or select/build a native artifact containing every requested ABI."
        )
    }
}
def abiToRustTarget = [
    "arm64-v8a"   : "aarch64-linux-android",
    "armeabi-v7a" : "armv7-linux-androideabi",
    "x86_64"      : "x86_64-linux-android",
]
def soCandidatesForAbi = { String abi, String soName ->
    String rustTarget = abiToRustTarget[abi]
    List<File> candidates = []

    candidates.add(new File(projectDir, "src/main/jniLibs/${abi}/${soName}"))
    candidates.add(new File(repoRoot, "android/volvoxgrid-android/src/main/jniLibs/${abi}/${soName}"))
    candidates.add(new File(repoRoot, "android/example/src/main/jniLibs/${abi}/${soName}"))
    if (rustTarget != null) {
        candidates.add(new File(repoRoot, "target/${rustTarget}/release/${soName}"))
        candidates.add(new File(repoRoot, "target/${rustTarget}/debug/${soName}"))
    }

    return candidates
}

def resolveSoForAbi = { String abi, String soName ->
    for (File candidate : soCandidatesForAbi(abi, soName)) {
        if (candidate.isFile()) {
            return candidate
        }
    }

    return null
}

if (volvoxgridSource == "local") {
    tasks.register("prepareVolvoxGridJniLibs") {
        def soInputs = project.provider {
            supportedAndroidAbis.collectMany { abi ->
                soCandidatesForAbi(abi, nativeLibraryName).findAll { it.isFile() }
            }
        }
        inputs.files(soInputs).withPropertyName("volvoxgridLibrarySoInputs")
        inputs.property("requestedAndroidAbis", requestedAndroidAbis)
        inputs.property("nativeLibraryName", nativeLibraryName)
        outputs.dir(generatedJniLibsDir)
        doLast {
            delete(generatedJniLibsDir)
            List<String> copiedAbis = []

            for (String abi : supportedAndroidAbis) {
                File librarySo = resolveSoForAbi(abi, nativeLibraryName)

                if (librarySo == null) {
                    continue
                }

                File outDir = new File(generatedJniLibsDir, abi)
                outDir.mkdirs()
                copy {
                    from librarySo
                    into outDir
                    rename { "libvolvoxgrid.so" }
                }
                copiedAbis.add(abi)
            }

            if (copiedAbis.isEmpty()) {
                throw new GradleException(
                    "Unable to find ${nativeLibraryName} for any Android ABI. " +
                    "Run `make android-library` (or `make android-library-release`) from the repo root " +
                    "before building Flutter."
                )
            }

            checkRequestedAbis(copiedAbis)
            logger.lifecycle("Prepared VolvoxGrid native library for ABIs: ${copiedAbis.join(', ')}")
        }
    }

    tasks.register("prepareVolvoxGridLocalKotlin") {
        inputs.file(androidNativeWindowHelperSource)
        outputs.dir(generatedLocalSourcesDir)
        doLast {
            if (!androidNativeWindowHelperSource.exists()) {
                throw new GradleException(
                    "NativeWindowHelper.kt not found at ${androidNativeWindowHelperSource}. " +
                    "Expected Android local source tree to be present."
                )
            }

            delete(generatedLocalSourcesDir)
            File outDir = new File(generatedLocalSourcesDir, "io/github/ivere27/volvoxgrid")
            outDir.mkdirs()
            copy {
                from androidNativeWindowHelperSource
                into outDir
            }
        }
    }
}

android {
    namespace = "io.github.ivere27.volvoxgrid"
    buildToolsVersion = "36.0.0"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        if (volvoxgridSource == "local") {
            ndk {
                abiFilters += supportedAndroidAbis
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    if (volvoxgridSource == "local") {
        externalNativeBuild {
            cmake {
                path = localNativeHelperCmakePath
            }
        }
        sourceSets {
            main {
                java.srcDirs += "src/main/kotlin"
                java.srcDirs += generatedLocalSourcesDir
                jniLibs.srcDirs = [generatedJniLibsDir]
            }
        }
    } else {
        sourceSets {
            main {
                java.srcDirs += "src/main/kotlin"
                // In Maven mode, native libs must come from the AAR dependency.
                // Avoid packaging checked-in/local jniLibs from this plugin module.
                jniLibs.srcDirs = []
            }
        }
    }
}

if (volvoxgridSource == "local") {
    tasks.named("preBuild") {
        dependsOn("prepareVolvoxGridJniLibs")
        dependsOn("prepareVolvoxGridLocalKotlin")
    }
}

if (volvoxgridSource == "maven") {
    // Resolve a single AAR early so missing published binaries produce guidance
    // before the APK build can succeed with a runtime-only loading failure.
    def nativeArtifact = configurations.create("volvoxgridNativeArtifact") {
        transitive = false
    }
    dependencies.add(nativeArtifact.name, "io.github.ivere27:${artifactName}:${volvoxgridVersion}@aar")
    tasks.register("verifyVolvoxGridNativeArtifact") {
        doLast {
            try {
                def libraries = nativeArtifact.files.collectMany { aar ->
                    zipTree(aar).matching { include "jni/**/${nativeLibraryName}" }.files.toList()
                }
                if (libraries.isEmpty()) throw new GradleException("The AAR contains no jni/*/${nativeLibraryName}.")
                checkRequestedAbis(libraries.collect { it.parentFile.name }.toSet())
            } catch (Exception error) {
                throw new GradleException(
                    "VolvoxGrid: Cannot obtain Android native library io.github.ivere27:${artifactName}:${volvoxgridVersion}. " +
                    "Check Maven Central access and VOLVOXGRID_VERSION (defaults to package pubspec version). " +
                    "For a source build use VOLVOXGRID_SOURCE=local with the monorepo checkout and build its Android native libraries first. " +
                    "Cause: ${error.message}", error)
            }
        }
    }
    tasks.named("preBuild") { dependsOn("verifyVolvoxGridNativeArtifact") }
}

configurations.configureEach {
    if (isSnapshot) {
        resolutionStrategy.cacheChangingModulesFor(0, "seconds")
    }
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22")
    implementation("androidx.annotation:annotation:1.7.0")

    if (volvoxgridSource == "maven") {
        // Pull native .so files + Kotlin/Java classes from the published AAR.
        implementation("io.github.ivere27:${artifactName}:${volvoxgridVersion}") {
            changing = isSnapshot
        }
    }
}
