apply from: new File(projectDir, "../native/config.gradle")

repositories {
    def repository = System.getenv("VOLVOXGRID_MAVEN_REPOSITORY")
    if (repository) maven { url = uri(repository) }
    else mavenCentral()
}
configurations { volvoxgrid }
def vGroup = System.getenv("VOLVOXGRID_GROUP") ?: "io.github.ivere27"
def vVariant = System.getenv("VOLVOXGRID_VARIANT") ?: ""
if (vVariant == "lite") throw new GradleException("VolvoxGrid: This platform requires the full native text renderer. Unset VOLVOXGRID_VARIANT; lite is supported on Android, iOS and macOS.")
def vArtifact = System.getenv("VOLVOXGRID_ARTIFACT") ?: (vVariant == "lite" ? "volvoxgrid-desktop-lite" : "volvoxgrid-desktop")
def vVersion = volvoxgridNativeVersion
def hostArch = (System.getProperty("os.arch") ?: "").toLowerCase(Locale.ROOT)
def nativeArch = ["x86_64": "linux-x86_64", "amd64": "linux-x86_64", "aarch64": "linux-aarch64", "arm64": "linux-aarch64", "x86": "linux-x86", "i386": "linux-x86", "i686": "linux-x86", "arm": "linux-armv7"][hostArch]
if (nativeArch == null) {
    throw new GradleException("VolvoxGrid: Unsupported linux architecture: ${hostArch}")
}
def nativeName = "libvolvoxgrid.so"
def outputDir = project.findProperty("volvoxgridOutputDir") ?: "${buildDir}/native"
if (volvoxgridNativeSource == "maven") {
    dependencies { volvoxgrid("${vGroup}:${vArtifact}:${vVersion}") { changing = vVersion.endsWith("-SNAPSHOT") } }
}

tasks.register("copyNative") {
    doLast {
        File destination = project.file("${outputDir}/${nativeName}")
        // A direct Gradle copy invalidates any Apple resolver source stamp.
        project.delete(new File(destination.toString() + ".source"))
        if (volvoxgridNativeSource == "maven") {
            // Remove stale output before resolving a different version/arch.
            project.delete(destination)
            try {
                project.copy {
                    duplicatesStrategy = DuplicatesStrategy.FAIL
                    from configurations.volvoxgrid.collect { zipTree(it) }
                    include "native/${nativeArch}/${nativeName}"
                    eachFile { it.path = it.name }
                    includeEmptyDirs = false
                    into outputDir
                }
            } catch (Exception error) {
                throw new GradleException("VolvoxGrid: Cannot obtain ${vGroup}:${vArtifact}:${vVersion}. Check Maven access and VOLVOXGRID_VERSION; for offline builds set VOLVOXGRID_SOURCE=local and VOLVOXGRID_LIBRARY. Cause: ${error.message}", error)
            }
        } else {
            def explicit = System.getenv("VOLVOXGRID_LIBRARY")
            if (vVariant == "lite" && !explicit) throw new GradleException("VolvoxGrid: Local lite builds require VOLVOXGRID_LIBRARY pointing to the lite native binary.")
            def candidates = explicit ? [new File(explicit)] : [new File(projectDir, "x64/${nativeName}")]
            if (!explicit && volvoxgridRepositoryRoot != null) {
                candidates.add(new File(volvoxgridRepositoryRoot, "target/release/${nativeName}"))
                candidates.add(new File(volvoxgridRepositoryRoot, "target/debug/${nativeName}"))
            }
            def localLibrary = candidates.find { it.isFile() }
            if (localLibrary == null) throw new GradleException("VolvoxGrid: No local ${nativeName}. Build the engine or set VOLVOXGRID_LIBRARY; use VOLVOXGRID_SOURCE=maven for published binaries.")
            if (localLibrary.canonicalFile != destination.canonicalFile) {
                project.copy { from localLibrary; into outputDir }
            }
        }
        if (!destination.isFile()) {
            throw new GradleException("VolvoxGrid: ${vGroup}:${vArtifact}:${vVersion} contains no native/${nativeArch}/${nativeName}. Check version, architecture, and Maven availability.")
        }
    }
}
