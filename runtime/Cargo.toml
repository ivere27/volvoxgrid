[package]
name = "volvoxgrid-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
name = "volvoxgrid"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standard", "demo"]
wasm-default = ["demo"]
standard = [
    "cosmic-text",
    "rayon",
]
demo = ["volvoxgrid-engine/demo"]
cosmic-text = ["volvoxgrid-engine/cosmic-text"]
rayon = ["volvoxgrid-engine/rayon"]
gpu = ["cosmic-text", "volvoxgrid-engine/gpu", "dep:pollster", "dep:wgpu"]
wasm-threads = ["dep:wasm-bindgen-rayon"]

[dependencies]
prost = "0.12"
volvoxgrid-engine = { path = "../engine", default-features = false, features = ["grpc"] }
ctor = "0.2"
lazy_static = "1.5"
pollster = { version = "0.4", optional = true }
wgpu = { version = "24", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-rayon = { version = "1.2", optional = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "ImageData", "HtmlCanvasElement"] }
web-time = "1"
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
cc = "1"
